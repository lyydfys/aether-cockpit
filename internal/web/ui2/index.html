<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Aether Cockpit：本机算力聚合网关。把多个 AI 渠道收敛成一个端点，统一管理账号、额度、用量与唤醒任务。">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<title>Aether Cockpit</title>
<link rel="icon" type="image/svg+xml" href="assets/aether-cockpit.svg">
<!-- 字体先预载，避免首屏用回退字重渲染后再跳动 -->
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- 中文 400 是正文主力字重，和 Inter 一起预载；500/600 由 CSS 触发，晚一步不影响首屏 -->
<link rel="preload" href="assets/fonts/noto-sans-sc-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<!-- 让浏览器在解析 app.js 之前就并行抓取核心模块，少两三个瀑布往返 -->
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/shell.js">
<link rel="modulepreload" href="js/router.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/dom.js">
<link rel="modulepreload" href="js/components.js">
<link rel="modulepreload" href="js/icons.js">
<link rel="modulepreload" href="js/brandicons.js">
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay" class="overlay-root"></div>
<!-- 单一播报点：只播报变化的一句话，不再让整个应用变成 live region -->
<div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
