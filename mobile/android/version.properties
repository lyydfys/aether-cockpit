# Stage 7 发布门禁：版本号的**唯一来源**。
#
# 为什么单独放一个文件：
#   - `versionCode`/`versionName` 一旦散落在 build.gradle.kts、CI、脚本里，发版时必然漂移；
#   - 这个文件是纯文本，`scripts/check-mobile-release.sh` 可以在不启动 Gradle 的情况下读它，
#     再拿它去核对 APK 里的真实值（两边对不上就失败）。
#
# 改版本号只改这里。升 versionCode 时别动历史值（Android 要求单调递增）。
versionCode=2
versionName=0.2.0
