name: Desktop macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Static analysis
        run: go vet ./...

      - name: Run macOS platform tests
        run: go test ./internal/core/appstart ./internal/core/launcher ./internal/desktop -count=1

      - name: Build macOS app
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build \
            -platform darwin/universal \
            -skipbindings \
            -s \
            -clean \
            -tags desktop,production \
            -ldflags "-s -w -X aether-cockpit/internal/core/gateway.BuildVersion=${version} -X aether-cockpit/internal/core/gateway.BuildTime=${build_time}"

      - name: Package app
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/AetherCockpit.app \
            "dist/aether-cockpit-${version}-macos-universal.zip"
          shasum -a 256 "dist/aether-cockpit-${version}-macos-universal.zip" > dist/SHA256SUMS.txt

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: aether-cockpit-macos-unsigned
          path: dist/*
          if-no-files-found: error
