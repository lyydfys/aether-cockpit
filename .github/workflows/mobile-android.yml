name: Mobile Android Stage 0

on:
  pull_request:
    paths:
      - "mobile/**"
      - "internal/mobilebridge/**"
      - "cmd/mobilebridge/**"
      - "scripts/build-android-mobilebridge.sh"
      - "scripts/check-mobile-stage0.sh"
      - ".github/workflows/mobile-android.yml"
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "internal/mobilebridge/**"
      - "cmd/mobilebridge/**"
      - "scripts/build-android-mobilebridge.sh"
      - "scripts/check-mobile-stage0.sh"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

jobs:
  stage0:
    name: Stage 0 gate (pinned MCA AAR + arm64 bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"

      - name: Make scripts executable
        run: chmod +x mobile/android/gradlew scripts/build-android-mobilebridge.sh scripts/check-mobile-stage0.sh

      - name: Run Stage 0 gate
        run: bash scripts/check-mobile-stage0.sh --ci

      - name: Upload Stage 0 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-android-arm64
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            dist/android/arm64-v8a/libaether_mobilebridge.so
            dist/android/arm64-v8a/mobilebridge-probe
