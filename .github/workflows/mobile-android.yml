name: Mobile Android Gate

on:
  pull_request:
    paths:
      - "mobile/**"
      - "internal/**"
      - "cmd/mobilebridge/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-mobilebridge.sh"
      - "scripts/check-mobile-stage0.sh"
      - "scripts/check-mobile-stage1.sh"
      - ".github/workflows/mobile-android.yml"
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "internal/**"
      - "cmd/mobilebridge/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-mobilebridge.sh"
      - "scripts/check-mobile-stage0.sh"
      - "scripts/check-mobile-stage1.sh"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

jobs:
  stage0:
    name: Mobile gate (pinned MCA AAR + arm64 bridge + Stage 1)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=29.0.13113456" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: chmod +x mobile/android/gradlew scripts/build-android-mobilebridge.sh scripts/check-mobile-stage0.sh scripts/check-mobile-stage1.sh

      - name: Run Stage 0 gate
        run: bash scripts/check-mobile-stage0.sh --ci

      - name: Run Stage 1 gate
        run: bash scripts/check-mobile-stage1.sh

      - name: Upload Stage 0 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-android-arm64
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            dist/android/arm64-v8a/libaether_mobilebridge.so
            dist/android/arm64-v8a/mobilebridge-probe

  # Stage 0 acceptance includes "Android emulator/device load native library".
  # The hosted `stage0` job above runs only `--ci`, which cannot touch a device,
  # so that acceptance item is NOT covered there. This job is the real coverage:
  # it runs the same script with `--device` against a self-hosted arm64 runner.
  #
  # Why arm64 and not an x86_64 emulator: the Go runtime hits a syscall that
  # Android's untrusted_app seccomp policy blocks on x86_64 (SYS_LSTAT=6), while
  # arm64 has no lstat syscall at all. See docs/internal/STAGE0_X86_64_BLOCKER.md.
  #
  # This job is manual and requires an opt-in repo variable, so it never reports
  # green without actually running. If AETHER_ARM64_DEVICE is unset, it is
  # skipped and says so -- that is deliberate: a device gate that silently skips
  # is worse than no gate.
  device:
    name: Stage 0 device gate (self-hosted arm64)
    if: github.event_name == 'workflow_dispatch' && vars.AETHER_ARM64_DEVICE == 'true'
    runs-on: [self-hosted, android-arm64]
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate a connected device
        id: device
        run: |
          ADB="${ADB:-adb}"
          command -v "$ADB" >/dev/null 2>&1 || { echo "adb not found; self-hosted runner must provide platform-tools"; exit 1; }
          SERIAL="$("$ADB" devices | awk '/\tdevice$/ && $1 !~ /^emulator-/ {print $1; exit}')"
          test -n "$SERIAL" || { echo "no physical device attached to this runner"; "$ADB" devices; exit 1; }
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          echo "using device $SERIAL"
          echo "ADB=$ADB" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: chmod +x mobile/android/gradlew scripts/build-android-mobilebridge.sh scripts/check-mobile-stage0.sh scripts/check-mobile-stage1.sh

      - name: Run Stage 0 gate against the device
        run: bash scripts/check-mobile-stage0.sh --device "${{ steps.device.outputs.serial }}"

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-device-log
          path: docs/evidence/stage0-*.log
          if-no-files-found: ignore
