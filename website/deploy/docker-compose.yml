# Aether Cockpit 官网 —— Docker 部署
#
# 服务器是 Docker 镜像，用这个文件一键起站。
#
#   1. 把 website/ 整个目录传到服务器（或只传需要的文件 + 本目录）
#   2. cd website && docker compose -f deploy/docker-compose.yml up -d --build
#
# 域名/端口改这里即可，不用动 nginx 配置。

services:
  site:
    build:
      # 构建上下文是 website/ 根目录
      context: ..
      dockerfile: deploy/Dockerfile
    image: aether-cockpit-site:latest
    container_name: aether-cockpit-site
    restart: unless-stopped

    ports:
      # 「宿主端口:容器端口」。80 被占用时改左边，例如 "8080:80"
      - "80:80"

    # 站点是只读静态文件，降低被写入的风险
    read_only: true

    # read_only 下 nginx 仍需写这几个位置
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    # 日志走 stdout，用 docker logs 查看；限制大小避免撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 2 vCPU / 2 GiB 的小机器上，给 nginx 留一点上限即可
    deploy:
      resources:
        limits:
          memory: 128M
