# Aether Cockpit 官网 —— nginx 配置（宿主机直装版）
#
# 放置：
#   sudo cp aether-cockpit.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/aether-cockpit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需要改的地方只有 server_name 和 root，都标了「改这里」。
# 若用 Docker 部署请看 docker-compose.yml + nginx-container.conf。

server {
    listen 80;
    listen [::]:80;

    # 改这里：你的域名（没有域名就填服务器公网 IP）
    server_name example.com www.example.com;

    # 改这里：站点文件所在目录
    root /var/www/aether-cockpit;
    index index.html;

    charset utf-8;
    default_type application/octet-stream;

    # ---------------------------------------------------------
    # 先把 80 跳 443；证书没签好之前保持注释
    # ---------------------------------------------------------
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # return 301 https://$host$request_uri;

    # ---------------------------------------------------------
    # 压缩
    #   woff2 / webp / png 本身已压缩，不再重复压（gzip_types 不列它们）
    #   css/js/html 收益很大：首页 50 KB → 13.5 KB
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 装了 brotli 模块可启用（优先级高于 gzip）
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript
    #              application/json image/svg+xml;

    # ---------------------------------------------------------
    # 缓存策略
    #
    # 注意：本站文件名**没有内容哈希**（无构建步骤），所以不能给
    # immutable/一年 —— 否则换了截图，老访客永远看到旧文件。
    # 按更新频率分档：
    # ---------------------------------------------------------

    # 入口 HTML：永不缓存，改完立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # CSS / JS：小文件，1 小时
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 图片：很少改，30 天
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # ---------------------------------------------------------
    # 字体
    #   nginx < 1.21.1 的 mime.types 没有 woff2，会被当成 octet-stream
    #   （字体仍能加载，但部分浏览器/代理会拒绝或告警）。
    #   这里给字体单独一张 types 表：该 location 只服务字体文件，
    #   局部替换是安全且完整的。
    # ---------------------------------------------------------
    location ~* \.(?:woff2|woff|ttf|otf)$ {
        types {
            font/woff2 woff2;
            font/woff  woff;
            font/ttf   ttf;
            font/otf   otf;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # 路由：单页 + 锚点，没有前端路由，不需要回退到 index.html
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /var/log/nginx/aether-cockpit.access.log;
    error_log  /var/log/nginx/aether-cockpit.error.log warn;
}

# =============================================================
# HTTPS（证书签好后取消注释；用 certbot --nginx 会自动写这段）
#
# 注意 http2 语法：nginx ≥1.25.1 用 `http2 on;`，
# 旧版本要写成 `listen 443 ssl http2;`
# =============================================================
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name example.com www.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # HSTS：全站 HTTPS 跑稳一周后再开，开了浏览器会记住，回退麻烦
#     # add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # 其余 gzip / 缓存 / location 配置同上，整段复制过来即可
# }
