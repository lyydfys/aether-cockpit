# Aether Cockpit 官网 —— nginx 配置
#
# 放置：
#   sudo cp aether-cockpit.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/aether-cockpit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需要改的地方只有三处，都标了「改这里」。

server {
    listen 80;
    listen [::]:80;

    # 改这里：你的域名（没有域名就用服务器 IP）
    server_name example.com www.example.com;

    root /var/www/aether-cockpit;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------
    # 先把 80 跳 443；证书没签好之前先注释掉这两行
    # ---------------------------------------------------------
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # return 301 https://$host$request_uri;

    # ---------------------------------------------------------
    # 压缩
    #   woff2 / webp / png 本身已压缩，不再重复压（gzip_types 里不列）
    #   css/js/html 压缩收益很大：143 KB → 40 KB
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 若装了 brotli 模块，启用它（优先级高于 gzip）
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript
    #              application/json image/svg+xml;

    # ---------------------------------------------------------
    # MIME
    #   新版 nginx 的 mime.types 已含 webp / woff2，
    #   这里显式声明一次，避免老版本把它当 octet-stream 下载。
    # ---------------------------------------------------------
    types {
        text/html       html htm;
        text/css        css;
        text/javascript js mjs;
        image/webp      webp;
        image/svg+xml   svg;
        image/png       png;
        font/woff2      woff2;
    }
    default_type application/octet-stream;

    # ---------------------------------------------------------
    # 缓存策略
    #
    # 注意：本站的文件名**没有内容哈希**（没有构建步骤），
    # 所以不能给 immutable/一年 —— 否则你换了截图，老访客永远看到旧的。
    # 按更新频率分档：
    # ---------------------------------------------------------

    # 入口 HTML：永不缓存，改完立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS / JS：小文件，1 小时，方便改样式后较快生效
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 图片 / 字体：很少改，30 天
    location ~* \.(?:webp|png|jpe?g|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ---------------------------------------------------------
    # 路由
    #   单页 + 锚点，没有前端路由，所以不需要 try_files 回退到 index.html
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 日志
    access_log /var/log/nginx/aether-cockpit.access.log;
    error_log  /var/log/nginx/aether-cockpit.error.log warn;
}

# =============================================================
