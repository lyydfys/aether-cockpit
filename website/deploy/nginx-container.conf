# 容器内 nginx 配置
#
# 与 aether-cockpit.conf 的差别：
#   1. 根目录固定为镜像内的 /usr/share/nginx/html
#   2. 日志走 stdout/stderr（nginx:alpine 默认已把 /var/log/nginx/*.log
#      软链到这两个口），这样 docker logs 能直接看
#   3. 不写 access_log 文件路径，避免容器里 sideways 写盘
#   4. 不设 user（镜像里已由 base image 处理）
#
# 本文件放在 /etc/nginx/conf.d/default.conf，只含 server{} 块。

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 入口 HTML：不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # CSS / JS：1 小时
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 图片：30 天
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # 字体：单独一张 types 表（见 aether-cockpit.conf 里的说明）
    location ~* \.(?:woff2|woff|ttf|otf)$ {
        types {
            font/woff2 woff2;
            font/woff  woff;
            font/ttf   ttf;
            font/otf   otf;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
