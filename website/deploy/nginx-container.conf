# 容器内 nginx 配置
#
# 与 aether-cockpit.conf 的差别：
#   1. 根目录固定为镜像内的 /usr/share/nginx/html
#   2. 日志走 stdout/stderr（nginx:alpine 默认已把 /var/log/nginx/*.log
#      软链到这两个口），这样 docker logs 能直接看
#   3. 不写 access_log 文件路径，避免容器里 sideways 写盘
#   4. 不设 user（镜像里已由 base image 处理）
#
# 本文件放在 /etc/nginx/conf.d/default.conf，只含 server{} 块。

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    default_type application/octet-stream;

    # 不暴露 nginx 版本号（默认会回 "Server: nginx/1.27.5"）
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 入口 HTML：不缓存
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 更新日志页：与首页一样不缓存（内容由 JSON 驱动，壳很少变）
    location = /changelog.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CSS / JS：1 小时
    location ~* \.(?:css|js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 图片：30 天
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # 字体：单独一张 types 表（见 aether-cockpit.conf 里的说明）
    location ~* \.(?:woff2|woff|ttf|otf)$ {
        include /etc/nginx/security-headers.conf;
        types {
            font/woff2 woff2;
            font/woff  woff;
            font/ttf   ttf;
            font/otf   otf;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ---------------------------------------------------------
    # 构建产物下载
    #   文件由 sync-downloads.sh 镜像到本机磁盘，
    #   用户从官网域名直接下载，不依赖 GitHub 的实时连通性。
    # ---------------------------------------------------------
    # 安装包与校验文件：用 ^~ 前缀匹配 + alias
    #   注意：alias 不能与 location 正则混用（会把 URI 拼到路径上，
    #   结果是 301 跳转到错误位置）。这里用 ^~ 让 nginx 走前缀匹配，
    #   URI 剩余部分会正确追加到 alias 目录后。
    location ^~ /download/ {
        alias /usr/share/nginx/html/downloads/;
        include /etc/nginx/security-headers.conf;
        index off;
        autoindex off;

        # APK 与 ZIP 的 MIME：nginx 自带 mime.types 里没有 apk
        types {
            application/vnd.android.package-archive apk;
            application/zip                        zip;
            application/octet-stream               bin;
            text/plain                             txt;
        }
        default_type application/octet-stream;

        # 安装包强制当附件下载，避免安卓把 .apk 当页面打开
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 大文件下载很吃 IO，不写访问日志
        access_log off;

        # 两份随发版变化的清单：都不能缓存，且必须能被 fetch 直接读取。
        # 用精确匹配（=）而不是正则 —— alias 配正则会把 URI 拼错并 301。
        # 只用 default_type 定类型，不要再 add_header Content-Type，
        # 否则响应里会出现两条 Content-Type。
        location = /download/manifest.json {
            include /etc/nginx/security-headers.conf;
            alias /usr/share/nginx/html/downloads/manifest.json;
            default_type application/json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            charset utf-8;
        }

        location = /download/releases.json {
            include /etc/nginx/security-headers.conf;
            alias /usr/share/nginx/html/downloads/releases.json;
            default_type application/json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            charset utf-8;
        }
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        include /etc/nginx/security-headers.conf;
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
        add_header Cache-Control "no-store" always;
    }
}
