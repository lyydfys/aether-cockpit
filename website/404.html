<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 — Aether Cockpit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef2fa">
<!-- 404 页刻意不引用 site.css：万一静态资源整体异常，这页仍能正常显示 -->
<style>
  :root {
    --bg: #eef2fa;
    --fg: #17181b;
    --fg-2: #3c4045;
    --muted: #5b6067;
    --line: rgba(148, 168, 198, 0.3);
    --accent: #1a73e8;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e13;
      --fg: #f2f6ff;
      --fg-2: #c7d2e5;
      --muted: #97a4bd;
      --line: rgba(255, 255, 255, 0.16);
      --accent: #7fb4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    background:
      radial-gradient(1100px 700px at 8% -8%, rgba(219, 231, 255, 0.9), transparent 62%),
      radial-gradient(900px 620px at 92% 4%, rgba(244, 228, 255, 0.8), transparent 58%),
      var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 460px; text-align: center; }
  .code {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  h1 {
    margin: 14px 0 0;
    font-size: clamp(26px, 5vw, 34px);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  p {
    margin: 14px 0 0;
    color: var(--fg-2);
    font-size: 15px;
    line-height: 1.7;
  }
  .actions {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.18s, border-color 0.18s;
  }
  .primary {
    background: var(--accent);
    color: #fff;
  }
  .primary:hover { background: #175fc4; }
  .ghost {
    border: 1px solid var(--line);
    color: var(--fg-2);
  }
  .ghost:hover { border-color: var(--muted); color: var(--fg); }
  .foot {
    margin-top: 34px;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>这个地址没有内容</h1>
    <p>链接可能过期了，或者地址打错了一个字符。<br>回到首页重新找入口即可。</p>
    <div class="actions">
      <a class="primary" href="/">回到首页</a>
      <a class="ghost" href="https://github.com/lyydfys/aether-cockpit">查看仓库</a>
    </div>
    <div class="foot">Aether Cockpit · 算力聚合网关</div>
  </main>
</body>
</html>
